# Where a book goes, decided by its genre.
#
# `genres` maps a genre string to exactly one category; `categories` maps that
# category to its folder on disk and the Open Notebook notebook that should
# receive it. The notebook names deliberately do NOT match the folder names —
# that mismatch is real (your notebooks are "Fictional", "historical",
# "Self help", "Islamic guidance"), so it is encoded here rather than guessed
# at runtime.
#
# Matching is substring, case-insensitive, and **longest needle first** — so
# "space opera" beats "space", without depending on the order things appear
# below. Add specific rules freely.
#
# The one exception is `precedence` below, which is checked before any needle.
#
# A book resolves to exactly ONE category: its genres are scanned in the order
# Goodreads ranks them (most popular first) and the first genre that hits any
# rule decides. No hit at all falls back to `fallback` and is flagged
# needs_review in the UI so you can fix it rather than have it misfiled.

fallback: Fiction

# Rules that win outright over the longest-needle scan below.
#
# The scan prefers the longest needle, which is right for most pairs — but it
# is wrong once a book carries both a specific tag and the word "fiction":
# Goodreads tags a historical novel ["Historical Fiction", "Fiction",
# "Literary"], and "historical fiction" being longer than "fiction" filed it
# under History. The library's rule is the opposite one: **anything that names
# fiction is fiction**, however specific the longer rule is.
#
#   match:  words that claim the book for `category`. Whole words, not
#           substrings — otherwise "fiction" matches inside "nonfiction".
#   never:  strings removed from a genre before ANY matching happens, this
#           block's or the scan's. "Non Fiction" is a word and a space, so a
#           word-boundary test alone still reads the "fiction" in it; masking
#           the phrase first is what keeps nonfiction books out of the Fiction
#           folder.
#
# Checked per genre, not per book: a book tagged ["Fantasy", "Fiction"] is
# still Fantasy, because the rule is about what a genre says, and its first
# genre says Fantasy. A book whose genre list merely *contains* the bare tag
# "Fiction" somewhere is not swept in — that is what would collapse the whole
# Fantasy shelf (59 of 62 Fantasy books carry a bare "Fiction" tag).
precedence:
  - category: Fiction
    match: [fiction]
    never: [nonfiction, non fiction, non-fiction]

categories:
  SciFi:
    folder: Space
    notebook: Space
  Fantasy:
    folder: Fiction
    notebook: Fictional
  Fiction:
    folder: Fiction
    notebook: Fictional
  History:
    folder: History
    notebook: historical
  Technical:
    folder: Technical
    notebook: Technical
  Self-Help:
    folder: Self-Help
    notebook: Self help
  How-To:
    folder: How-To
    notebook: How-To
  Islamic:
    folder: Islamic
    notebook: Islamic guidance
  Manga:
    folder: Manga
    notebook: ""          # no notebook yet; the notebook stage skips these
  # /books/Natgeo and its notebook are reserved for the National Geographic
  # magazine archive, which lives there by hand and is not part of this
  # pipeline at all (no book row, nothing to classify). No genre reaches
  # this category any more (the old nature/natural history/geography/travel
  # rules were deleted) specifically so a real downloaded book never lands
  # here by a genre match — a travel book is a book, and books go in Fiction
  # (or whichever more specific category actually fits) so they end up
  # alongside the rest of what you actually read, not mixed in with scans.
  Natgeo:
    folder: Natgeo
    notebook: Natgeo
  Science:
    folder: Science
    notebook: Science
  Poetry:
    folder: Poetry
    notebook: Poetry
  Memoir:
    folder: Memoir
    notebook: Memoir

genres:
  # --- speculative -----------------------------------------------------
  # SHADOWED, not dead. `science fiction` and `speculative fiction` name
  # fiction, so the `precedence` rule above claims them first and these two
  # needles can no longer be reached through a genre: those books now file
  # under Fiction and nothing new lands in /books/Space. The rules are left
  # here on purpose, so the decision is one deletion (the precedence entry)
  # away from being reversible. The rest of this block still works — a book
  # tagged "space opera", "dystopia" or "cyberpunk" with no fiction-named
  # genre still resolves SciFi.
  science fiction: SciFi
  speculative fiction: SciFi
  sci-fi: SciFi
  scifi: SciFi
  space opera: SciFi
  space exploration: SciFi
  dystopia: SciFi
  cyberpunk: SciFi

  # --- fantasy ---------------------------------------------------------
  epic fantasy: Fantasy
  urban fantasy: Fantasy
  magical realism: Fantasy
  fantasy: Fantasy

  # --- history ---------------------------------------------------------
  historical fiction: History
  military history: History
  ancient history: History
  history: History

  # --- memoir / biography ------------------------------------------------
  # Split out from History: a personal life story (a comedian's memoir, an
  # astronaut's memoir) is a different message than a book actually about
  # history or politics, and mixing them in one Open Notebook notebook was
  # exactly the wrong-messages-combined problem this file exists to avoid.
  # Matching scans a book's genres in Goodreads' popularity order and stops
  # at the first one that hits any rule, so a book whose "History" genre
  # outranks its "Memoir"/"Biography" genre still resolves History — this
  # block only fires when memoir/biography is the higher-ranked genre.
  biography: Memoir
  autobiography: Memoir
  memoir: Memoir
  biography memoir: Memoir

  # --- technical -------------------------------------------------------
  computer science: Technical
  software engineering: Technical
  software architecture: Technical
  software development: Technical
  programming: Technical
  algorithms: Technical
  data science: Technical
  machine learning: Technical
  mathematics: Technical
  engineering: Technical
  technology: Technical
  # Titles carry these even when no metadata source has genres, which is the
  # only reason a book like "Software Architecture with Kotlin" classifies at
  # all. Deliberately multi-word or unambiguous — a bare "architecture" would
  # sweep in books about buildings.
  kotlin: Technical
  python: Technical
  javascript: Technical
  rust programming: Technical
  c++: Technical
  databases: Technical
  networking: Technical
  linux: Technical
  devops: Technical
  cybersecurity: Technical
  cryptography: Technical

  # --- science -----------------------------------------------------------
  # Split out because it had no bucket at all: Sagan's and deGrasse Tyson's
  # books were landing in Self-Help via a lower-ranked "Philosophy" genre, or
  # in History via the memoir fallback, neither of which is the actual
  # subject. Bare "space" is deliberately left out — it would risk pulling a
  # SciFi novel tagged just "Space" (no "fiction"-named genre at all) in here;
  # every real case found so far already carries "Science" or "Astronomy".
  science: Science
  popular science: Science
  physics: Science
  astronomy: Science
  cosmology: Science
  chemistry: Science
  biology: Science

  # --- self help -------------------------------------------------------
  self help: Self-Help
  self-help: Self-Help
  personal development: Self-Help
  psychology: Self-Help
  productivity: Self-Help
  philosophy: Self-Help

  # --- poetry --------------------------------------------------------
  # Previously unmapped: every poetry collection fell through every rule
  # to `fallback` and sat in Fiction flagged needs_review.
  poetry: Poetry
  poems: Poetry

  # --- islamic ---------------------------------------------------------
  islamic: Islamic
  islam: Islamic
  quran: Islamic
  muslim: Islamic
  sufism: Islamic

  # --- manga / comics --------------------------------------------------
  manga: Manga
  graphic novels: Manga
  comics: Manga

  # --- practical -------------------------------------------------------
  how to: How-To
  cookbook: How-To
  cooking: How-To
  crafts: How-To
  hobbies: How-To
  reference: How-To

  # --- general ---------------------------------------------------------
  # `fiction` stays even though the `precedence` rule already claims the bare
  # word: as a plain substring it is what catches the compounds a word-boundary
  # test misses ("fanfiction", "autofiction"). The negated spellings cannot
  # reach it — `never` removes them from the genre before this scan runs.
  fiction: Fiction
  literary fiction: Fiction
  classics: Fiction
  novel: Fiction
