<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goodreads</title>
<!-- Goodreads' own pairing: Lato for the interface, Merriweather for titles
     and bylines. Loaded from Google Fonts with the full system fallback in
     app.css, so the page degrades to Georgia/Helvetica with no internet. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@400;700&display=swap">
<link rel="stylesheet" href="/static/app.css?v=__ASSET_VERSION__">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
</head>
<body>
<div class="shell">
  <!-- A 50px light bar with brown text, which is what goodreads.com's own
       .siteHeader is: #382110 is the colour of the *text* on it, and the bar
       only goes dark (#32362d) under the pointer. -->
  <header class="bar">
    <div class="bar-inner">
      <a class="wordmark" href="#/">goodreads</a>
      <nav class="nav" id="nav" aria-label="Primary"></nav>
      <span class="spacer"></span>
      <div class="bar-search">
        <input type="search" id="global-search" placeholder="Search books"
               oninput="onHeaderSearch(this.value)" autocomplete="off" aria-label="Search books">
        <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      </div>
      <!-- Only shown under 1000px, where the search box drops to its own row. -->
      <button class="search-toggle" type="button" onclick="toggleSearch()" aria-label="Search books" aria-expanded="false" aria-controls="global-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
      <!-- Only shown under 780px, where the health pill and sign-out below no
           longer fit beside the wordmark and search without wrapping the bar
           to a third row. Collapses both behind one button instead. -->
      <button class="menu-toggle" type="button" onclick="toggleAccountMenu()" aria-label="Service status and account" aria-expanded="false" aria-controls="acct-panel">
        <span class="dot" id="menu-dot" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <!-- display:contents above 780px, so these sit inline exactly as before;
           becomes a dropdown panel under the toggle button below it. -->
      <div class="acct-panel" id="acct-panel">
        <!-- The one control with no Goodreads equivalent: service health, always
             on screen, one click from the page that explains and logs it. -->
        <a class="health-pill" id="health-pill" href="#/services"></a>
        <div class="bar-account">
          <a class="nav-link" href="#" onclick="signOut();return false;">Sign out</a>
        </div>
      </div>
    </div>
  </header>

  <div class="page" id="page">
    <main class="col" id="main">
      <div id="banner"></div>
      <div id="view"><div class="state loading" role="status">Loading…</div></div>
    </main>
    <aside class="rail" id="rail" aria-label="Service status and run control"></aside>
  </div>

  <!-- Sibling of .page, not a cell in it: the footer spans the full width and
       stays under the rail on every breakpoint. -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <nav class="site-footer-links" aria-label="Footer">
        <div>
          <h4>Pages</h4>
          <a href="#/">Home</a>
          <a href="#/books">My Books</a>
          <a href="#/genres">Genres</a>
          <a href="#/services">Services</a>
          <a href="#/activity">Activity</a>
        </div>
        <div>
          <h4>Project</h4>
          <a href="https://github.com/ohmzi/goodreads-pipeline" target="_blank" rel="noopener">GitHub</a>
          <a href="https://github.com/ohmzi/goodreads-pipeline/blob/main/docs/VERSION.md" target="_blank" rel="noopener">Release notes</a>
          <a href="#/version">Version history</a>
        </div>
        <div>
          <h4>Session</h4>
          <a href="/goodreads">Sign in to Goodreads</a>
          <a href="#" onclick="signOut();return false;">Sign out</a>
        </div>
      </nav>
      <div class="site-footer-meta">
        <p class="site-footer-copy">© 2026 goodreads-pipeline — self-hosted, not affiliated with Goodreads or Amazon</p>
        <a class="site-footer-version" id="footer-version" href="#/version"></a>
      </div>
    </div>
  </footer>
</div>

<div id="toasts"></div>
<script src="/static/app.js?v=__ASSET_VERSION__"></script>
<script>
function signOut() {
  fetch('/api/auth/logout', { method: 'POST' }).finally(() => window.location.replace('/login'));
}
</script>
</body>
</html>
